  title: "The Artery of Salt & Steel: Inside the 100-Year Overhaul of the Estuary Span"
  kicker: "INVESTIGATION & SPECIAL REPORT — ESTUARY REGION"
  subhead: "Battling unrelenting marine gales and metallurgical fatigue, an elite corps of deep-water riggers rebuilds the continental lifeline while traffic never pauses above."
  lead_paragraph: "Every morning at four o’clock, before the dawn mist burns off the Estuary mouth, thirty-two deep-sea riggers ascend the north suspension pylon in cages smaller than upright coffins. Two hundred and eighty meters above the cold Firth basin, the wind is not a draft; it is a permanent geological current carrying sixty kilograms of salt foam per cubic hour."
  body_markdown: "A century later, that same steel spine is carrying eighty-five thousand lorries, bulk grain carriers, and express electric trains every single day. The bridge has never closed for more than twelve consecutive hours in its hundred-year lifespan.\n\n“The original builders worked with sublime confidence, but they did not have access to scanning electron microscopes,” explains Dr. Marta Lindqvist, chief metallurgist on site. “Bessemer steel has a high nitrogen and phosphorus content. When exposed to maritime humidity over eighty winters, the grain boundaries suffer from interstitial stress-corrosion cracking.”"
  body_html: "<p>A century later, that same steel spine is carrying eighty-five thousand lorries, bulk grain carriers, and express electric trains every single day...</p>"
