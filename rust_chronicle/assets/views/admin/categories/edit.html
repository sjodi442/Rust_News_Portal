{% extends "admin/admin_base.html" %}

{% block title %}Edit Desk: {{ category.name }}{% endblock title %}

{% block content %}
<div class="max-w-xl mx-auto space-y-6">

  <div class="flex items-center justify-between border-b-2 border-primary pb-4">
    <div>
      <span class="font-kicker text-xs uppercase tracking-widest text-secondary font-bold">Taxonomy Desk</span>
      <h2 class="font-masthead text-2xl font-black uppercase text-primary">Edit Category #{{ category.id }}</h2>
    </div>
    <a href="/admin/categories" class="font-kicker text-xs uppercase font-bold text-secondary hover:underline">
      ← Back to Categories
    </a>
  </div>

  <form action="/admin/categories/{{ category.id }}" method="post" class="space-y-4 border border-primary bg-surface-low p-6">
    <div>
      <label class="block font-kicker text-xs uppercase font-bold text-primary mb-1">
        Desk / Category Name <span class="text-error">*</span>
      </label>
      <input type="text" name="name" required value="{{ category.name }}" class="w-full text-xs p-2 bg-background border border-primary focus:ring-0 focus:border-black font-semibold"/>
    </div>

    <div>
      <label class="block font-kicker text-xs uppercase font-bold text-primary mb-1">
        URL Slug <span class="text-error">*</span>
      </label>
      <input type="text" name="slug" required value="{{ category.slug }}" class="w-full font-mono text-xs p-2 bg-background border border-outline focus:ring-0 focus:border-black"/>
    </div>

    <div>
      <label class="block font-kicker text-xs uppercase font-bold text-primary mb-1">
        Display Order Priority
      </label>
      <input type="number" name="display_order" value="{{ category.display_order }}" min="0" class="w-full font-mono text-xs p-2 bg-background border border-outline focus:ring-0 focus:border-black"/>
    </div>

    <div class="pt-4 border-t border-outline-variant flex justify-between items-center">
      <a href="/admin/categories" class="font-kicker text-xs uppercase font-bold text-secondary hover:underline">
        Cancel
      </a>
      <button type="submit" class="px-6 py-2 bg-primary text-white font-kicker text-xs uppercase font-bold tracking-wider hover:bg-neutral-800 transition-colors border border-primary">
        Update Category
      </button>
    </div>
  </form>

</div>
{% endblock content %}
